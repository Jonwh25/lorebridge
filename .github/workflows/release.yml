name: Release Foundry Module

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Verify tag matches module version
        shell: bash
        run: |
          VERSION=$(node -p "require('./packages/foundry-module/module.json').version")
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match module version v${VERSION}."
            exit 1
          fi

      - name: Validate project
        run: npm run validate

      - name: Package Foundry module
        run: npm run package:foundry

      - name: Verify release archive layout
        run: node -e "
          import('node:fs').then(({readFileSync}) => {
            const data = readFileSync('release/lorebridge.zip');
            const str = data.toString('binary');
            const required = ['module.json', 'dist/main.js', 'styles/lorebridge.css'];
            for (const f of required) {
              if (!str.includes(f)) { console.error('Missing from zip: ' + f); process.exit(1); }
            }
            console.log('Archive contains all required files.');
          });
        "

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/module.json \
            release/lorebridge.zip \
            --title "LoreBridge ${GITHUB_REF_NAME}" \
            --generate-notes
